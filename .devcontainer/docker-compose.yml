version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    
    env_file:
      - path: ../.docker/.dist.env
        required: true
      - path: .env
        required: false

    command: sleep infinity

    networks:
      - friendica-network

  db:
    image: mariadb:latest
    env_file:
      - path: ../.docker/.dist.env
        required: true # default
      - path: .env
        required: false
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-friendica}
      - MYSQL_USER=${MYSQL_USER:-friendica}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-friendica}
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - friendica-network
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -p\"${MYSQL_ROOT_PASSWORD:-root}\" --protocol=tcp || exit 1"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  phpmyadmin:
    image: phpmyadmin:latest
    env_file:
      - path: ../.docker/.dist.env
        required: false
      - path: .env
        required: false
    ports:
      - ${PHPMYADMIN_PORT:-8086}:80
    environment:
      - PMA_HOST=${MYSQL_HOST:-db}
      - PMA_PORT=${MYSQL_PORT:-3306}
      - PMA_USER=root
      - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - friendica-network

  redis:
    image: redis:latest
    networks:
      - friendica-network
    expose:
      - "6379"

volumes:
  mariadb_data:

networks:
  friendica-network:
    driver: bridge
